name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Core unit tests
        run: |
          cmake -S core -B build/core -DHBR_BUILD_TESTS=ON
          cmake --build build/core -j
          ./build/core/hbr_core_tests

      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: holistic-bg-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk


      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk holistic-background-remover.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest holistic-background-remover.apk \
            --title "Holistic Background Remover (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download holistic-background-remover.apk on your Android phone and open it to install."
