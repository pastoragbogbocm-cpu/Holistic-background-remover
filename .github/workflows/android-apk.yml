name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Core unit tests
        run: |
          cmake -S core -B build/core -DHBR_BUILD_TESTS=ON
          cmake --build build/core -j
          ./build/core/hbr_core_tests

      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Check MediaPipe survived code shrinking
        run: |
          dex=$(mktemp)
          unzip -p app/build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' > "$dex"
          for cls in \
            'Lcom/google/mediapipe/tasks/vision/imagesegmenter/ImageSegmenter;' \
            'Lcom/google/mediapipe/framework/image/MPImage;' \
            'Lcom/google/mediapipe/framework/image/ByteBufferExtractor;' \
            'Lcom/holistic/hbr_engine/Segmenter;'; do
            if ! strings "$dex" | grep -qF "$cls"; then
              echo "::error::$cls was stripped or renamed by R8; person segmentation would return empty masks"
              exit 1
            fi
          done

      - name: Make test clips
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          tools/ci/make_test_media.sh app/android/app/src/androidTest/assets

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device test - person stays in front of the new background
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd app/android && ./gradlew :app:connectedReleaseAndroidTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/app/reports/androidTests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: holistic-bg-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk holistic-background-remover.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest holistic-background-remover.apk \
            --title "Holistic Background Remover (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} and tested on an Android emulator. Download holistic-background-remover.apk on your Android phone and open it to install."
